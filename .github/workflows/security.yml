name: Security Scan

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Build and Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Run OWASP Dependency-Check
        id: depcheck
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'java-security-lab'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 0
            --enableRetired

      - name: Upload Dependency-Check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          retention-days: 7

      - name: Fail job if vulnerabilities were found
        if: ${{ steps.depcheck.outcome == 'failure' }}
        run: |
          echo "Dependency-Check found vulnerabilities at or above the configured CVSS threshold."
          exit 1
